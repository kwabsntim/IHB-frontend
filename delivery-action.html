<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Delivery Action...</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff;
            min-height: 100vh;
        }
        
        .delivery-action-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        
        .delivery-action-card {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 10px 40px rgba(31, 41, 55, 0.1);
            text-align: center;
        }
        
        .logo-container {
            margin-bottom: 32px;
        }
        
        .logo-container img {
            height: 60px;
            max-width: 200px;
        }
        
        .delivery-action-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1F2937;
            margin: 0 0 16px;
        }
        
        .delivery-action-card p {
            font-size: 16px;
            color: #6B7280;
            margin: 0 0 32px;
            line-height: 1.6;
        }
        
        .spinner {
            margin: 24px auto;
            width: 60px;
            height: 60px;
        }
        
        .spinner svg {
            animation: rotate 1s linear infinite;
        }
        
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        
        .spinner circle {
            stroke: #DC2626;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }
        
        @keyframes dash {
            0% {
                stroke-dasharray: 1, 150;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -35;
            }
            100% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -124;
            }
        }
        
        .message-box {
            padding: 20px;
            border-radius: 12px;
            margin: 24px 0;
            font-size: 16px;
            font-weight: 500;
        }
        
        .message-box.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }
        
        .message-box.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 2px solid #DC2626;
        }
        
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #DC2626, #991B1B);
            color: #fff;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
        }
        
        .btn-secondary {
            background: #F3F4F6;
            color: #1F2937;
            border: 2px solid #e5e7eb;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="delivery-action-container">
        <div class="delivery-action-card">
            <div class="logo-container">
                <img src="/static/logo2.png" alt="IHB Transport Logo" loading="lazy">
            </div>
            
            <h1 id="pageTitle">Processing Request...</h1>
            <p id="pageDescription">Please wait while we process your request.</p>
            
            <div id="spinner" class="spinner">
                <svg viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                </svg>
            </div>
            
            <div id="messageBox" class="message-box hidden"></div>
            
            <div id="actionButtons" class="action-buttons hidden">
                <a href="/track.html" id="trackBtn" class="btn btn-primary hidden">View Tracking</a>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        (async function() {
            const API_BASE = 'https://ihb-transport-dk.onrender.com';
            
            // Parse URL to get instant quote ID and action
            const path = window.location.pathname || '';
            const match = path.match(/^(?:\/api\/public)?\/instant-quotes\/([^\/]+)\/(accept|decline)\/?$/i);
            
            if (!match) {
                showError('Invalid URL format. Please check the link from your email.');
                return;
            }
            
            const quoteId = decodeURIComponent(match[1]);
            const action = match[2].toLowerCase();
            
            // Update UI based on action
            const titles = {
                accept: 'Accepting Quote',
                decline: 'Declining Quote'
            };
            
            const descriptions = {
                accept: 'We are processing your acceptance...',
                decline: 'We are processing your decline...'
            };
            
            document.getElementById('pageTitle').textContent = titles[action] || 'Processing...';
            document.getElementById('pageDescription').textContent = descriptions[action] || 'Please wait...';
            document.title = titles[action] || 'Processing...';
            
            // Call backend API for accept/decline
            try {
                const endpoint = `${API_BASE}/api/public/instant-quotes/${encodeURIComponent(quoteId)}/${action}`;
                
                const body = action === 'decline' ? JSON.stringify({ reason: 'Client declined' }) : undefined;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: body
                });
                
                // Hide spinner
                document.getElementById('spinner').classList.add('hidden');
                
                let data = null;
                try {
                    const text = await response.text();
                    if (text) data = JSON.parse(text);
                } catch (e) {
                    // Response might not be JSON
                }
                
                if (response.ok) {
                    // Success
                    const successMessages = {
                        accept: data?.message || 'Quote accepted successfully! We will contact you shortly to arrange the delivery.',
                        decline: data?.message || 'Quote declined. We have been notified. Thank you for your response.'
                    };
                    
                    showSuccess(successMessages[action] || 'Action completed successfully!');
                    
                    document.getElementById('actionButtons').classList.remove('hidden');
                } else {
                    // Error
                    const errorMessage = data?.message || data?.error || `Failed with status ${response.status}`;
                    showError(errorMessage);
                    document.getElementById('actionButtons').classList.remove('hidden');
                }
                
            } catch (error) {
                // Network error
                document.getElementById('spinner').classList.add('hidden');
                showError(`Network error: ${error.message}. Please check your connection and try again.`);
                document.getElementById('actionButtons').classList.remove('hidden');
            }
            
            function showSuccess(message) {
                const messageBox = document.getElementById('messageBox');
                messageBox.textContent = message;
                messageBox.className = 'message-box success';
                messageBox.classList.remove('hidden');
            }
            
            function showError(message) {
                const messageBox = document.getElementById('messageBox');
                messageBox.textContent = message;
                messageBox.className = 'message-box error';
                messageBox.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
