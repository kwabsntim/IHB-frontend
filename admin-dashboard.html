<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; padding:24px; background:#f7fafc; }
    .wrap { max-width:1400px; margin:0 auto; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo-small { height:42px; }
    .card { background:#fff; border-radius:8px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06); margin-top:18px; }
    .cards-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:18px; }
    @media (max-width: 1024px) {
      .cards-grid { grid-template-columns:1fr; }
    }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #eee; font-size:14px; }
    th { background:#fafafa; font-weight:600; }
    .actions { display:flex; gap:8px; }
    .btn { padding:8px 12px; border-radius:6px; background:#111827; color:#fff; text-decoration:none; display:inline-block; }
    .success { background:#16a34a; }
    .danger { background:#b91c1c; }
    .muted { color:#6b7280; }
    .empty { text-align:center; padding:36px; color:#6b7280; }
    /* Enhanced UI styles for dashboard */
    .card { border-radius:12px; padding:20px; box-shadow:0 8px 28px rgba(17,24,39,0.06); border:1px solid rgba(15,23,42,0.04); }
    table { border-radius:8px; overflow:hidden; background:linear-gradient(180deg,#fff,#fbfdff); }
    th, td { padding:12px 14px; }
    tbody tr { transition: background .12s ease, transform .06s ease; }
    tbody tr:hover { background: #fbfdff; transform: translateY(-1px); }
    .actions { display:flex; gap:10px; align-items:center; }
    .btn { padding:8px 12px; border-radius:10px; background:#111827; color:#fff; border:none; box-shadow:0 6px 14px rgba(17,24,39,0.08); cursor:pointer; transition:transform .08s ease, box-shadow .12s ease, opacity .08s ease; font-weight:600; }
    .btn:hover { transform: translateY(-2px); box-shadow:0 10px 22px rgba(17,24,39,0.12); opacity:0.98; }
    .btn:active { transform: translateY(0); box-shadow:0 6px 12px rgba(17,24,39,0.08); }
    .btn.small { padding:6px 10px; font-size:13px; }
    .btn.success { background: linear-gradient(180deg,#22c55e,#15803d); }
    .btn.danger { background: linear-gradient(180deg,#ef4444,#b91c1c); }
    .btn.secondary { background: linear-gradient(180deg,#64748b,#374151); }
    .muted { color:#6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div style="display:flex; align-items:center; gap:12px;">
          <img src="static/logo2.png" alt="IHB" class="logo-small">
          <div>
            <h1 style="margin:0; font-size:20px;" data-i18n="admin.dashboard.title">Admin Dashboard</h1>
            <div class="muted" data-i18n="admin.dashboard.subtitle">Manage deliveries</div>
          </div>
        </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <select id="langSelect" style="border-radius:8px; padding:6px 8px; font-weight:600;">
          <option value="da">🇩🇰 Dansk</option>
          <option value="en">🇬🇧 English</option>
        </select>
        <button id="refreshBtn" class="btn">Refresh</button>
        <button id="logoutBtn" class="btn danger">Logout</button>
      </div>
    </div>

    <div class="cards-grid">
      <div id="instantQuotesCard" class="card">
        <h2 style="margin-top:0; font-size:16px;" data-i18n="admin.instant_quotes.title">Instant Quotes</h2>
        <div id="instantQuotesContainer" data-i18n-loading>Loading…</div>
      </div>

      <div id="deliveriesCard" class="card">
        <h2 style="margin-top:0; font-size:16px;" data-i18n="admin.deliveries.title">Deliveries</h2>
        <div id="deliveriesContainer" data-i18n-loading>Loading…</div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>

  <script>
    (function(){
      // Use explicit backend admin base per project configuration
      const ADMIN_BASE = 'https://ihb-transport-dk.onrender.com/api/admin';
      const API_BASE = 'https://ihb-transport-dk.onrender.com';
      const token = localStorage.getItem('ihb_admin_token');

      function ensureAuth() {
        if (!token) {
          window.location.href = 'admin.html';
          return false;
        }
        return true;
      }

      function authFetch(path, opts = {}) {
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + token;
        opts.headers['Accept'] = 'application/json';
        return fetch(path, opts);
      }

      // helper to POST to non-admin API endpoints (driver/public) with auth when possible
      function authPostApi(path, body) {
        const headers = { 'Accept': 'application/json' };
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(API_BASE + path, { method: 'POST', headers, body: body !== undefined ? JSON.stringify(body) : undefined });
      }

      function fmtDate(s) {
        try { const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleString(); } catch(e){return s}
      }

      function renderTable(items) {
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        if (!items || !items.length) {
          return `<div class="empty">${t('admin.delivery.none')}</div>`;
        }

        const rows = items.map(it => {
          const id = it.id || it._id || it.delivery_id || it.uuid || '';
          const status = it.status || '-';
          const statusLower = String(status).toLowerCase().replace(/[\s_-]/g, '');
          const created = fmtDate(it.created_at || it.createdAt || it.created || '');
          const client = (it.client_name || it.client || it.customer_name) || '';
          
          // Build actions depending on status
          let actionBtn = '';
          
          switch(statusLower) {
            case 'requested':
              // Status: REQUESTED -> Show "Set Price" button
              actionBtn = `<button data-id="${id}" class="btn set-price">${t('button.set_price')}</button>`;
              break;
              
            case 'priced':
              // Status: PRICED -> Show "Awaiting response" badge (no action button)
              actionBtn = `<span style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.awaiting_response')}</span>`;
              break;
              
            case 'accepted':
              // Status: ACCEPTED -> Show "Quote accepted" badge (no action button for admin)
              actionBtn = `<span style="background:#d1fae5;color:#065f46;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.quote_accepted')}</span>`;
              break;
              
            case 'declined':
              // Status: DECLINED -> Show "Revise Price" button
              actionBtn = `<button data-id="${id}" class="btn secondary revise-price">${t('button.revise_price')}</button>`;
              break;
              
            case 'inprogress':
            case 'in_progress':
              // Status: IN_PROGRESS -> Show "In transit" badge (no action button)
              actionBtn = `<span style="background:#dbeafe;color:#1e40af;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.in_transit')}</span>`;
              break;
              
            case 'delivered':
              // Status: DELIVERED -> Show "Delivered" badge (no action button)
              actionBtn = `<span style="background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.delivered')}</span>`;
              break;
              
            default:
              // Default: allow setting price
              actionBtn = `<button data-id="${id}" class="btn set-price">${t('button.set_price')}</button>`;
          }

          return `
            <tr>
              <td style="width:200px;"><strong>${id}</strong><div class="muted" style="font-size:12px">${created}</div></td>
              <td>${client}</td>
              <td>${status}</td>
              <td style="width:280px"><div class="actions">
                <button data-id="${id}" class="btn open-public">${t('button.details')}</button>
                ${actionBtn}
              </div></td>
            </tr>
          `;
        }).join('');

        return `<table><thead><tr><th>${t('table.delivery')}</th><th>${t('table.client')}</th><th>${t('table.status')}</th><th>${t('table.actions')}</th></tr></thead><tbody>${rows}</tbody></table>`;
      }

      async function loadDeliveries() {
        if (!ensureAuth()) return;
        const container = document.getElementById('deliveriesContainer');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        container.innerHTML = t('admin.deliveries.loading');
        try {
          const res = await authFetch(ADMIN_BASE + '/deliveries');
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) { localStorage.removeItem('ihb_admin_token'); window.location.href = 'admin.html'; return; }
            const txt = await res.text(); container.innerHTML = '<div class="error">Failed to load: ' + (txt||res.status) + '</div>'; return;
          }
          const data = await res.json();
          // Some APIs return { deliveries: [...] }
          const items = Array.isArray(data) ? data : (data.deliveries || data.data || []);
          document.getElementById('deliveriesContainer').innerHTML = renderTable(items);
          attachActions();
        } catch (err) {
          container.innerHTML = '<div class="error">Network error: ' + (err.message||err) + '</div>';
        }
      }

      async function loadInstantQuotes() {
        if (!ensureAuth()) return;
        const container = document.getElementById('instantQuotesContainer');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        container.innerHTML = t('admin.deliveries.loading');
        try {
          const res = await authFetch(ADMIN_BASE + '/instant-quotes');
          
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) { 
              localStorage.removeItem('ihb_admin_token'); 
              window.location.href = 'admin.html'; 
              return; 
            }
            const txt = await res.text(); 
            console.error('Failed to load instant quotes:', res.status, txt);
            container.innerHTML = '<div class="error">Failed to load quotes: ' + (txt||res.status) + '</div>'; 
            return;
          }
          
          const data = await res.json();
          console.log('Instant quotes response:', data);
          const items = Array.isArray(data) ? data : (data.quotes || data.data || data.instantQuotes || []);
          document.getElementById('instantQuotesContainer').innerHTML = renderInstantQuotesTable(items);
          attachActions();
        } catch (err) {
          console.error('Network error loading instant quotes:', err);
          container.innerHTML = '<div class="error">Network error: ' + (err.message||err) + '</div>';
        }
      }

      function renderInstantQuotesTable(items) {
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        if (!items || !items.length) {
          return `<div class="empty">${t('admin.instant_quotes.none')}</div>`;
        }

        const rows = items.map(it => {
          const id = it.id || it._id || it.quote_id || it.uuid || '';
          const status = it.status || 'REQUESTED';
          const statusLower = String(status).toLowerCase().replace(/[\s_-]/g, '');
          const created = fmtDate(it.created_at || it.createdAt || it.created || '');
          const email = it.client_email || it.email || '';
          const pickup = it.pickup_point || '-';
          const delivery = it.delivery_address || '-';
          const weight = it.weight || '-';
          
          // Build actions depending on status (same as deliveries)
          let actionBtn = '';
          
          switch(statusLower) {
            case 'requested':
              actionBtn = `<button data-id="${id}" data-type="quote" class="btn set-price">${t('button.set_price')}</button>`;
              break;
              
            case 'priced':
              actionBtn = `<span style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.awaiting_response')}</span>`;
              break;
              
            case 'accepted':
              actionBtn = `<span style="background:#d1fae5;color:#065f46;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.quote_accepted')}</span>`;
              break;
              
            case 'declined':
              actionBtn = `<button data-id="${id}" data-type="quote" class="btn secondary revise-price">${t('button.revise_price')}</button>`;
              break;
              
            case 'inprogress':
            case 'in_progress':
              actionBtn = `<span style="background:#dbeafe;color:#1e40af;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.in_transit')}</span>`;
              break;
              
            case 'delivered':
              actionBtn = `<span style="background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.delivered')}</span>`;
              break;
              
            default:
              actionBtn = `<button data-id="${id}" data-type="quote" class="btn set-price">${t('button.set_price')}</button>`;
          }

          return `
            <tr>
              <td style="width:200px;"><strong>${id}</strong><div class="muted" style="font-size:12px">${created}</div></td>
              <td>${email}<div class="muted" style="font-size:12px">${pickup} → ${delivery}</div><div class="muted" style="font-size:12px">Weight: ${weight}</div></td>
              <td>${status}</td>
              <td style="width:280px"><div class="actions">
                <button data-id="${id}" data-type="quote" class="btn open-public">${t('button.details')}</button>
                ${actionBtn}
              </div></td>
            </tr>
          `;
        }).join('');

        return `<table><thead><tr><th>${t('table.quote')}</th><th>${t('table.client')}</th><th>${t('table.status')}</th><th>${t('table.actions')}</th></tr></thead><tbody>${rows}</tbody></table>`;
      }

      /* Modal builder and renderer for delivery details (styled like track.html) */
      function createDeliveryModal() {
        if (document.getElementById('deliveryModal')) return document.getElementById('deliveryModal');
        const modal = document.createElement('div');
        modal.id = 'deliveryModal';
        modal.style.position = 'fixed';
        modal.style.inset = '0';
        modal.style.display = 'none';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.background = 'rgba(0,0,0,0.35)';
        modal.style.zIndex = '10000';

        const card = document.createElement('div');
        card.className = 'card';
        card.style.maxWidth = '760px';
        card.style.width = 'calc(100% - 40px)';
        card.style.maxHeight = '80vh';
        card.style.overflow = 'auto';

        const closeBtn = document.createElement('button');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        closeBtn.textContent = t('admin.modal.close');
        closeBtn.className = 'btn';
        closeBtn.style.float = 'right';
        closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });

        const title = document.createElement('h2');
        title.textContent = t('admin.modal.title');
        title.style.marginTop = '0';

        const content = document.createElement('div');
        content.id = 'deliveryModalContent';

        card.appendChild(closeBtn);
        card.appendChild(title);
        card.appendChild(content);
        modal.appendChild(card);
        document.body.appendChild(modal);
        return modal;
      }

      function omitKey(key) {
        const lower = String(key).toLowerCase();
        if (lower === 'client_email') return true;
        if (lower.endsWith('_logs') || lower.endsWith('_log')) return true;
        if (/((email|status).*(log|logs|history))/.test(lower)) return true;
        return false;
      }

      function looksLikeDate(s) {
        if (typeof s !== 'string') return false;
        return /^\d{4}-\d{2}-\d{2}(T|\s)?\d{0,2}:?\d{0,2}:?\d{0,2}/.test(s) || /^\d{4}-\d{2}-\d{2}$/.test(s);
      }

      function formatTimestamp(s) {
        try {
          const v = (typeof s === 'string' && /^\d+$/.test(s)) ? Number(s) : s;
          let d = new Date(v);
          if (isNaN(d.getTime())) return s;
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const day = d.getDate();
          const month = months[d.getMonth()];
          const year = d.getFullYear();
          const hours = String(d.getHours()).padStart(2,'0');
          const minutes = String(d.getMinutes()).padStart(2,'0');
          return `${day} ${month} ${year}, ${hours}:${minutes}`;
        } catch (e) { return s; }
      }

      function renderObjectAsRows(obj) {
        const wrap = document.createElement('div');
        wrap.style.display = 'block';
        Object.entries(obj).forEach(([key, value]) => {
          if (omitKey(key)) return;
          const row = document.createElement('div');
          row.style.display = 'grid';
          row.style.gridTemplateColumns = '180px 1fr';
          row.style.gap = '12px';
          row.style.padding = '8px 0';
          row.style.borderBottom = '1px solid #eee';

          const keyEl = document.createElement('div');
          keyEl.style.color = '#666';
          keyEl.textContent = key.replace(/_/g,' ');

          const valueEl = document.createElement('div');
          valueEl.style.color = '#111';
          valueEl.style.fontWeight = '500';

          if (Array.isArray(value)) {
            valueEl.textContent = value.join(', ');
          } else if (typeof value === 'object' && value !== null) {
            const pre = document.createElement('pre');
            pre.style.margin = '6px 0 0';
            pre.textContent = JSON.stringify(value, null, 2);
            valueEl.appendChild(pre);
          } else {
            if (looksLikeDate(value)) valueEl.textContent = formatTimestamp(value);
            else if (typeof value === 'number') {
              if (value > 1e12 || value > 1e9) valueEl.textContent = formatTimestamp(value);
              else valueEl.textContent = String(value ?? '—');
            } else valueEl.textContent = value ?? '—';
          }

          row.appendChild(keyEl);
          row.appendChild(valueEl);
          wrap.appendChild(row);
        });
        return wrap;
      }

      async function showDeliveryModalById(id) {
        const modal = createDeliveryModal();
        const content = document.getElementById('deliveryModalContent');
        content.innerHTML = '<div style="padding:18px;">Loading…</div>';
        modal.style.display = 'flex';
        try {
          // Try admin API first
          let res = await authFetch(ADMIN_BASE + '/deliveries/' + encodeURIComponent(id));
          if (!res.ok) {
            // fallback to public endpoint
            const publicBase = 'https://ihb-transport-dk.onrender.com/api/public/deliveries';
            res = await fetch(publicBase + '/' + encodeURIComponent(id));
            if (!res.ok) throw new Error('Not found');
          }
          const data = await res.json();
          let obj = data;
          if (obj && typeof obj === 'object' && Object.keys(obj).length === 1 && obj.delivery) obj = obj.delivery;
          content.innerHTML = '';
          content.appendChild(renderObjectAsRows(obj));
        } catch (err) {
          content.innerHTML = '<div style="padding:12px; color:#b91c1c">Failed to load details</div>';
        }
      }

      function attachActions() {
        // Set price (for REQUESTED deliveries/quotes)
        document.querySelectorAll('.set-price').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const type = e.currentTarget.dataset.type; // 'quote' or undefined
            const endpoint = type === 'quote' ? 'instant-quotes' : 'deliveries';
            
            const priceRaw = prompt('Enter price amount (e.g. 250):');
            if (priceRaw === null) return; // cancelled
            const priceClean = String(priceRaw).trim();
            // normalize comma decimals to dot
            const priceNum = Number(priceClean.replace(',', '.'));
            if (!isFinite(priceNum) || priceNum <= 0) {
              alert('Please enter a valid positive number for the price (e.g. 250).');
              return;
            }
            try {
              // Try admin API first
              let res = await authFetch(ADMIN_BASE + '/' + endpoint + '/' + encodeURIComponent(id) + '/price', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: priceNum })
              }).catch(() => null);

              // If unauthorized, force re-auth and redirect
              if (res && (res.status === 401 || res.status === 403)) {
                localStorage.removeItem('ihb_admin_token');
                alert('Authentication required. Please log in again.');
                window.location.href = 'admin.html';
                return;
              }

              // If admin endpoint failed, try a public/fallback API POST
              if (!res || !res.ok) {
                const fallback = await authPostApi('/' + endpoint + '/' + encodeURIComponent(id) + '/price', { price: priceNum }).catch(() => null);
                if (fallback && fallback.ok) { alert('Price set'); loadDeliveries(); loadInstantQuotes(); return; }

                // Extract any response text for debugging
                let debugText = 'No response';
                try {
                  if (res) debugText = await res.text().catch(() => String(res.status));
                  else if (fallback) debugText = await fallback.text().catch(() => String(fallback.status));
                } catch (e) { debugText = String(e); }
                alert('Failed to set price: ' + debugText);
                return;
              }

              // Success from admin endpoint
              alert('Price set');
              loadDeliveries();
              loadInstantQuotes();
            } catch (err) { alert('Network error: ' + (err && err.message ? err.message : err)); }
          });
        });

        // Revise price (for DECLINED deliveries)
        document.querySelectorAll('.revise-price').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const type = e.currentTarget.dataset.type || 'delivery';
            const endpoint = type === 'quote' ? 'instant-quotes' : 'deliveries';
            const priceRaw = prompt('Enter revised price amount (e.g. 250):');
            if (priceRaw === null) return; // cancelled
            const priceClean = String(priceRaw).trim();
            // normalize comma decimals to dot
            const priceNum = Number(priceClean.replace(',', '.'));
            if (!isFinite(priceNum) || priceNum <= 0) {
              alert('Please enter a valid positive number for the price (e.g. 250).');
              return;
            }
            try {
              // Try admin API first
              let res = await authFetch(ADMIN_BASE + '/' + endpoint + '/' + encodeURIComponent(id) + '/price', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: priceNum })
              }).catch(() => null);

              // If unauthorized, force re-auth and redirect
              if (res && (res.status === 401 || res.status === 403)) {
                localStorage.removeItem('ihb_admin_token');
                alert('Authentication required. Please log in again.');
                window.location.href = 'admin.html';
                return;
              }

              // If admin endpoint failed, try a public/fallback API POST
              if (!res || !res.ok) {
                const fallback = await authPostApi('/' + endpoint + '/' + encodeURIComponent(id) + '/revise-price', { price: priceNum }).catch(() => null);
                if (fallback && fallback.ok) { alert('Price revised'); loadDeliveries(); loadInstantQuotes(); return; }

                // Extract any response text for debugging
                let debugText = 'No response';
                try {
                  if (res) debugText = await res.text().catch(() => String(res.status));
                  else if (fallback) debugText = await fallback.text().catch(() => String(fallback.status));
                } catch (e) { debugText = String(e); }
                alert('Failed to revise price: ' + debugText);
                return;
              }

              // Success from admin endpoint
              alert('Price revised');
              loadDeliveries();
              loadInstantQuotes();
            } catch (err) { alert('Network error: ' + (err && err.message ? err.message : err)); }
          });
        });

        // Start delivery for Accepted deliveries -> calls driver pickup endpoint
        document.querySelectorAll('.start-delivery').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const el = e.currentTarget;
            const id = el.dataset.id;
            if (!id) return;
            if (!confirm('Start delivery for ' + id + '?')) return;
            el.disabled = true;
            const originalText = el.textContent;
            el.textContent = 'Starting...';
            try {
              // Try admin endpoint first
              let res = await authFetch(ADMIN_BASE + '/deliveries/' + encodeURIComponent(id) + '/pickup', { method: 'POST' }).catch(()=>({ ok:false }));
              if (!res || !res.ok) {
                // fallback to public/driver endpoint
                res = await authPostApi('/api/driver/deliveries/' + encodeURIComponent(id) + '/pickup');
              }
              if (!res.ok) {
                const text = await res.text().catch(()=>res.status);
                alert('Failed to start delivery: ' + text);
                el.disabled = false;
                el.textContent = originalText;
                return;
              }
              // success
              el.textContent = 'Started';
              loadDeliveries();
              loadInstantQuotes();
            } catch (err) {
              alert('Network error');
              el.disabled = false;
              el.textContent = originalText;
            }
          });
        });

        // Mark as done for In progress deliveries -> calls completion endpoint
        document.querySelectorAll('.mark-done').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const el = e.currentTarget;
            const id = el.dataset.id;
            if (!id) return;
            if (!confirm('Mark delivery ' + id + ' as completed?')) return;
            el.disabled = true;
            const originalText = el.textContent;
            el.textContent = 'Marking...';
            try {
              // Try admin endpoint first
              let res = await authFetch(ADMIN_BASE + '/deliveries/' + encodeURIComponent(id) + '/complete', { method: 'POST' }).catch(()=>({ ok:false }));
              if (!res || !res.ok) {
                // fallback to root deliveries complete
                res = await authPostApi('/deliveries/' + encodeURIComponent(id) + '/complete');
              }
              if (!res.ok) {
                const text = await res.text().catch(()=>res.status);
                alert('Failed to mark completed: ' + text);
                el.disabled = false;
                el.textContent = originalText;
                return;
              }
              // success
              el.textContent = 'Completed';
              loadDeliveries();
              loadInstantQuotes();
            } catch (err) {
              alert('Network error');
              el.disabled = false;
              el.textContent = originalText;
            }
          });
        });

        // Open public -> show modal with details
        document.querySelectorAll('.open-public').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.dataset.id;
            if (!id) return;
            showDeliveryModalById(id);
          });
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', function(){ localStorage.removeItem('ihb_admin_token'); window.location.href = 'admin.html'; });
      document.getElementById('refreshBtn').addEventListener('click', () => {
        loadDeliveries();
        loadInstantQuotes();
      });

      // initial load
      loadDeliveries();
      loadInstantQuotes();

      // --- Local i18n for this page (loads i18next and applies translations) ---
      (function(){
        function loadI18nLocal() {
          if (window.i18next) return Promise.resolve(window.i18next);
          return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/i18next@21.9.1/dist/umd/i18next.min.js';
            s.onload = () => resolve(window.i18next);
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        const resources = {
          en: { translation: { 'admin.title':'Admin Dashboard','admin.subtitle':'Manage deliveries','admin.deliveries.title':'Deliveries','admin.instant_quotes.title':'Instant Quotes','admin.deliveries.loading':'Loading…','admin.instant_quotes.none':'No instant quotes','button.refresh':'Refresh','button.logout':'Logout','table.delivery':'Delivery','table.quote':'Quote','table.client':'Client','table.status':'Status','table.actions':'Actions','button.details':'Details','button.start':'Start Delivery','button.set_price':'Set Price','button.revise_price':'Revise Price','button.mark_done':'Mark as done','badge.awaiting_response':'Awaiting response','badge.quote_accepted':'Quote accepted','badge.in_transit':'In transit','badge.delivered':'Delivered','loading':'Loading…' } },
          da: { translation: { 'admin.title':'Administrator Panel','admin.subtitle':'Administrer leverancer','admin.deliveries.title':'Leverancer','admin.instant_quotes.title':'Hurtige Tilbud','admin.deliveries.loading':'Indlæser…','admin.instant_quotes.none':'Ingen hurtige tilbud','button.refresh':'Opdater','button.logout':'Log ud','table.delivery':'Levering','table.quote':'Tilbud','table.client':'Kunde','table.status':'Status','table.actions':'Handlinger','button.details':'Detaljer','button.start':'Start levering','button.set_price':'Sæt pris','button.revise_price':'Revider pris','button.mark_done':'Marker som færdig','badge.awaiting_response':'Afventer svar','badge.quote_accepted':'Tilbud accepteret','badge.in_transit':'Under transport','badge.delivered':'Leveret','loading':'Indlæser…' } }
        };

        function applyLocal(i18n) {
          try {
            const h1 = document.querySelector('.header h1'); if (h1) h1.textContent = i18n.t('admin.title');
            const sub = document.querySelector('.header .muted'); if (sub) sub.textContent = i18n.t('admin.subtitle');
            const refresh = document.getElementById('refreshBtn'); if (refresh) refresh.textContent = i18n.t('button.refresh');
            const logout = document.getElementById('logoutBtn'); if (logout) logout.textContent = i18n.t('button.logout');
            
            // Translate section titles
            const deliveriesTitle = document.querySelector('[data-i18n="admin.deliveries.title"]');
            if (deliveriesTitle) deliveriesTitle.textContent = i18n.t('admin.deliveries.title');
            const quotesTitle = document.querySelector('[data-i18n="admin.instant_quotes.title"]');
            if (quotesTitle) quotesTitle.textContent = i18n.t('admin.instant_quotes.title');
            
            document.querySelectorAll('table thead th').forEach((th, idx) => {
              const keys = ['table.delivery','table.client','table.status','table.actions']; if (keys[idx]) th.textContent = i18n.t(keys[idx]);
            });
            document.querySelectorAll('.open-public').forEach(b => b.textContent = i18n.t('button.details'));
            document.querySelectorAll('.set-price').forEach(b => b.textContent = i18n.t('button.set_price'));
            document.querySelectorAll('.revise-price').forEach(b => b.textContent = i18n.t('button.revise_price'));
            document.querySelectorAll('.start-delivery').forEach(b => b.textContent = i18n.t('button.start'));
            document.querySelectorAll('.mark-done').forEach(b => b.textContent = i18n.t('button.mark_done'));
          } catch (e) { console.warn('i18n apply failed', e); }
        }

        loadI18nLocal().then(() => {
          try {
            // If i18next is already present, merge these local resources rather than re-initializing
            if (window.i18next && window.i18next.addResourceBundle) {
              ['en','da'].forEach(lng => {
                try {
                  const bundle = resources[lng] && resources[lng].translation ? resources[lng].translation : {};
                  window.i18next.addResourceBundle(lng, 'translation', bundle, true, true);
                } catch (e) { /* ignore */ }
              });
              const lng = localStorage.getItem('i18n_lang') || 'da';
              if (window.i18next.changeLanguage) window.i18next.changeLanguage(lng, () => applyLocal(window.i18next));
              else applyLocal(window.i18next);
              return;
            }

            // Otherwise initialize a local i18next instance
            if (window.i18next && window.i18next.init) {
              window.i18next.init({ lng: localStorage.getItem('i18n_lang')||'da', resources }, () => applyLocal(window.i18next));
            }
          } catch (err) { console.warn('i18n load/apply failed', err); }
        }).catch(err => console.warn('i18n load failed', err));

        const sel = document.getElementById('langSelect');
        if (sel) {
          sel.value = localStorage.getItem('i18n_lang') || 'da';
          sel.addEventListener('change', (e) => {
            const lng = e.target.value;
            localStorage.setItem('i18n_lang', lng);
            if (window.i18next && window.i18next.changeLanguage) {
              window.i18next.changeLanguage(lng, () => applyLocal(window.i18next));
            } else {
              // load and apply
              loadI18nLocal().then(() => window.i18next.init({ lng, resources }, () => applyLocal(window.i18next)));
            }
          });
        }
      })();
    })();
  </script>
</body>
</html>
