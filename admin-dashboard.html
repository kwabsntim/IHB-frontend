<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="icon" type="image/png" href="/static/logo2.png">
  <link rel="apple-touch-icon" href="/static/logo2.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; padding:0; background:#f7fafc; overflow-x:hidden; }
    .logo-small { height:42px; }
    .card { background:#fff; border-radius:8px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06); margin-top:18px; }
    .card:first-child { margin-top:0; }

    /* ---- Sidebar layout ---- */
    .dashboard-layout { display:flex; min-height:100vh; align-items:stretch; }

    .sidebar {
      width:260px;
      flex-shrink:0;
      background:#ffffff;
      color:#374151;
      border-right:1px solid #e5e7eb;
      display:flex;
      flex-direction:column;
      padding:20px 16px;
      gap:24px;
      position:sticky;
      top:0;
      align-self:flex-start;
      height:100vh;
      box-sizing:border-box;
    }

    .sidebar-header { display:flex; align-items:center; gap:12px; }
    .sidebar-header h1 { margin:0; font-size:16px; color:#111827; }
    .sidebar-header .muted { font-size:12px; }
    .sidebar-close-btn {
      display:none; margin-left:auto; width:36px; height:36px; flex-shrink:0;
      align-items:center; justify-content:center; background:none; border:1px solid #d1d5db;
      border-radius:8px; font-size:20px; line-height:1; color:#374151; cursor:pointer;
    }

    .sidebar-nav { display:flex; flex-direction:column; gap:2px; flex:1; }
    .nav-item {
      display:flex; align-items:center; gap:10px;
      background:none; border:none; border-left:3px solid transparent; color:#4b5563;
      padding:10px 12px; border-radius:6px; font-size:14px; font-weight:500;
      cursor:pointer; text-align:left; width:100%;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .nav-item:hover { background:#f3f4f6; color:#111827; }
    .nav-item.active { background:#f3f4f6; color:#111827; font-weight:700; border-left-color:#111827; }
    .nav-icon { display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .nav-icon svg { width:18px; height:18px; }

    .sidebar-footer { display:flex; flex-direction:column; gap:8px; }
    .sidebar-footer select,
    .sidebar-footer .btn { width:100%; box-sizing:border-box; }
    .sidebar-footer select { border-radius:6px; padding:8px; font-weight:500; font-size:13px; border:1px solid #d1d5db; background:#fff; color:#374151; }

    .main-content { flex:1; padding:24px; min-width:0; }
    .tab-panel[hidden] { display:none; }

    /* ---- Mobile top bar (hamburger) ---- */
    .mobile-topbar { display:none; }
    .sidebar-backdrop { display:none; }

    @media (max-width: 880px) {
      .dashboard-layout { flex-direction:column; }

      .mobile-topbar {
        display:flex; align-items:center; gap:12px;
        padding:10px 16px; background:#fff; border-bottom:1px solid #e5e7eb;
        position:sticky; top:0; z-index:1500;
      }
      .mobile-topbar .logo-small { height:28px; }
      .mobile-topbar-title { font-weight:700; font-size:15px; color:#111827; }
      .hamburger-btn {
        width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
        background:#fff; border:1px solid #d1d5db; border-radius:8px; cursor:pointer; padding:0;
      }
      .hamburger-btn svg { width:20px; height:20px; }

      .sidebar-backdrop {
        display:block; position:fixed; inset:0; background:rgba(17,24,39,0.45);
        z-index:1999; opacity:0; pointer-events:none; transition:opacity .2s ease;
      }
      .sidebar-backdrop.open { opacity:1; pointer-events:auto; }

      .sidebar {
        position:fixed; top:0; left:0; width:280px; max-width:85vw; height:100vh;
        transform:translateX(-100%); transition:transform .25s ease;
        z-index:2000; box-shadow:8px 0 28px rgba(17,24,39,0.15);
        flex-direction:column; gap:16px; padding:16px;
      }
      .sidebar.open { transform:translateX(0); }
      .sidebar-close-btn { display:flex; }

      .sidebar-nav { flex-direction:column; overflow-x:visible; gap:2px; }
      .nav-item { white-space:normal; min-height:44px; }
      .sidebar-footer { flex-direction:column; }
      .sidebar-footer select,
      .sidebar-footer .btn { width:100%; flex:none; min-width:0; }

      .main-content { padding:12px; }
      .card { margin-top:12px !important; padding:14px; width:100%; }
    }

    @media (max-width: 480px) {
      .card h2 { font-size:15px !important; }
      th, td { padding:10px; font-size:13px; }
    }

    .sidebar-footer select { min-height:38px; }

    /* ---- Tables: horizontal scroll container instead of blowing out the page ---- */
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; padding:0 2px; }
    .table-scroll table { min-width:620px; }
    td { word-break:break-word; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #eee; font-size:14px; }
    th { background:#fafafa; font-weight:600; }
    .muted { color:#6b7280; }
    .empty { text-align:center; padding:36px; color:#6b7280; }
    /* Enhanced UI styles for dashboard */
    .card { border-radius:10px; padding:20px; box-shadow:0 1px 2px rgba(17,24,39,0.04); border:1px solid #e5e7eb; }
    table { border-radius:8px; overflow:hidden; background:#fff; }
    th, td { padding:12px 14px; }
    tbody tr { transition: background .12s ease; }
    tbody tr:hover { background: #f9fafb; }
    .actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

    /* ---- Professional flat/outlined buttons ---- */
    .btn {
      padding:7px 14px; border-radius:6px; font-size:13px; font-weight:600;
      cursor:pointer; white-space:nowrap; min-width:fit-content; text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center; min-height:38px;
      background:#111827; color:#fff; border:1px solid #111827;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover { background:#1f2937; border-color:#1f2937; }
    .btn:active { background:#111827; }
    .btn.small { padding:6px 10px; font-size:12px; min-height:34px; }
    .btn.secondary { background:#fff; color:#374151; border-color:#d1d5db; }
    .btn.secondary:hover { background:#f9fafb; border-color:#9ca3af; }
    .btn.secondary.is-active { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
    .btn.secondary.is-active:hover { background:#d1fae5; }
    .btn.success { background:#fff; color:#047857; border-color:#a7f3d0; }
    .btn.success:hover { background:#ecfdf5; }
    .btn.danger { background:#DC2626; color:#fff; border-color:#DC2626; }
    .btn.danger:hover { background:#b91c1c; border-color:#b91c1c; }

    /* ---- Touch targets: grow on touch/mobile instead of shrinking ---- */
    @media (max-width: 880px) {
      .btn { min-height:44px; font-size:14px; padding:10px 16px; }
      .btn.small { min-height:40px; font-size:13px; }
      .sidebar-footer select { min-height:44px; font-size:14px; }
    }

    /* ---- Modal ---- */
    .modal-overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.35); z-index:10000; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal-card { background:#fff; border-radius:10px; max-width:760px; width:100%; max-height:85vh; overflow:auto; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,0.25); position:relative; }
    .modal-close { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:8px; border:1px solid #d1d5db; background:#fff; font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .modal-close:hover { background:#f3f4f6; }
    .modal-title { margin:0 44px 16px 0; font-size:18px; }
    .modal-row { display:grid; grid-template-columns:180px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid #eee; }
    .modal-row-key { color:#6b7280; font-size:13px; }
    .modal-row-value { color:#111827; font-weight:500; word-break:break-word; }
    @media (max-width: 560px) {
      .modal-overlay { padding:0; align-items:flex-end; }
      .modal-card { max-width:100%; max-height:92vh; border-radius:16px 16px 0 0; padding:16px; }
      .modal-row { grid-template-columns:1fr; gap:2px; padding:8px 0; }
    }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <header class="mobile-topbar">
      <button type="button" id="hamburgerBtn" class="hamburger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <img src="static/logo2.png" alt="IHB" class="logo-small">
      <span class="mobile-topbar-title" data-i18n="admin.dashboard.title">Admin Dashboard</span>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="static/logo2.png" alt="IHB" class="logo-small">
        <div>
          <h1 data-i18n="admin.dashboard.title">Admin Dashboard</h1>
          <div class="muted" data-i18n="admin.dashboard.subtitle">Manage deliveries</div>
        </div>
        <button type="button" id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Close menu">&times;</button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button type="button" class="nav-item active" data-tab="instantQuotes">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg></span><span id="navLabelInstantQuotes">Instant Quotes</span>
        </button>
        <button type="button" class="nav-item" data-tab="deliveries">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><span id="navLabelDeliveries">Deliveries</span>
        </button>
        <button type="button" class="nav-item" data-tab="reviews">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span id="navLabelReviews">Customer Reviews</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <select id="langSelect">
          <option value="da">🇩🇰 Dansk</option>
          <option value="en">🇬🇧 English</option>
        </select>
        <button id="archiveBtn" class="btn secondary" data-i18n="button.archive">Archive</button>
        <button id="refreshBtn" class="btn">Refresh</button>
        <button id="logoutBtn" class="btn danger">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="tab-panel" data-tab-panel="instantQuotes">
        <div id="instantQuotesCard" class="card">
          <h2 style="margin-top:0; font-size:16px;" data-i18n="admin.instant_quotes.title">Instant Quotes</h2>
          <div id="instantQuotesContainer" data-i18n-loading>Loading…</div>
        </div>
      </div>

      <div class="tab-panel" data-tab-panel="deliveries" hidden>
        <div id="deliveriesCard" class="card">
          <h2 style="margin-top:0; font-size:16px;" data-i18n="admin.deliveries.title">Deliveries</h2>
          <div id="deliveriesContainer" data-i18n-loading>Loading…</div>
        </div>
      </div>

      <div class="tab-panel" data-tab-panel="reviews" hidden>
        <div class="card">
          <h2 style="margin-top:0; font-size:16px;" data-i18n="admin.reviews.title">Customer Reviews</h2>
          <div id="reviewsContainer" data-i18n-loading>Loading…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>

  <script>
    (function(){
      // Use explicit backend admin base per project configuration
      const ADMIN_BASE = 'https://ihb-transport-1.onrender.com/api/admin';
      const API_BASE = 'https://ihb-transport-1.onrender.com';
      const token = localStorage.getItem('ihb_admin_token');
      
      // Store loaded data globally
      let cachedDeliveries = [];
      let cachedInstantQuotes = [];
      let showingArchive = false;

      function ensureAuth() {
        if (!token) {
          window.location.replace('admin.html');
          return false;
        }
        return true;
      }

      // Validate token on page load
      async function validateSession() {
        if (!token) {
          window.location.replace('admin.html');
          return false;
        }
        
        try {
          const res = await authFetch(ADMIN_BASE + '/deliveries');
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
              localStorage.removeItem('ihb_admin_token');
              window.location.replace('admin.html');
              return false;
            }
          }
          return true;
        } catch (err) {
          console.error('Session validation failed:', err);
          localStorage.removeItem('ihb_admin_token');
          window.location.replace('admin.html');
          return false;
        }
      }

      // Prevent back button after logout
      history.pushState(null, null, location.href);
      window.addEventListener('popstate', function() {
        if (!localStorage.getItem('ihb_admin_token')) {
          history.pushState(null, null, location.href);
          window.location.replace('admin.html');
        }
      });

      function authFetch(path, opts = {}) {
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + token;
        opts.headers['Accept'] = 'application/json';
        return fetch(path, opts);
      }

      // helper to POST to non-admin API endpoints (driver/public) with auth when possible
      function authPostApi(path, body) {
        const headers = { 'Accept': 'application/json' };
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(API_BASE + path, { method: 'POST', headers, body: body !== undefined ? JSON.stringify(body) : undefined });
      }

      function fmtDate(s) {
        try { const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleString(); } catch(e){return s}
      }

      function getTimeGroup(dateStr) {
        try {
          const date = new Date(dateStr);
          if (isNaN(date)) return 'older';
          
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);
          const lastWeek = new Date(today);
          lastWeek.setDate(lastWeek.getDate() - 7);
          const oneMonthAgo = new Date(today);
          oneMonthAgo.setDate(oneMonthAgo.getDate() - 30);
          
          const itemDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          
          if (itemDate.getTime() === today.getTime()) return 'today';
          if (itemDate.getTime() === yesterday.getTime()) return 'yesterday';
          if (itemDate >= lastWeek) return 'lastWeek';
          if (itemDate < oneMonthAgo) return 'archived';
          return 'older';
        } catch(e) {
          return 'older';
        }
      }

      function groupItemsByTime(items) {
        const groups = {
          today: [],
          yesterday: [],
          lastWeek: [],
          older: [],
          archived: []
        };
        
        items.forEach(item => {
          const dateStr = item.created_at || item.createdAt || item.created || '';
          const group = getTimeGroup(dateStr);
          groups[group].push(item);
        });
        
        return groups;
      }

      function renderTable(items, showArchived = false) {
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        if (!items || !items.length) {
          return `<div class="empty">${t('admin.delivery.none')}</div>`;
        }

        // Group items by time
        const groups = groupItemsByTime(items);
        const groupLabels = {
          today: t('time.today'),
          yesterday: t('time.yesterday'),
          lastWeek: t('time.last_week'),
          older: t('time.older'),
          archived: t('time.archived')
        };

        let html = '';
        
        // Show only archived items if in archive view, otherwise show all except archived
        const groupsToShow = showArchived ? ['archived'] : ['today', 'yesterday', 'lastWeek', 'older'];
        
        groupsToShow.forEach(groupKey => {
          const groupItems = groups[groupKey];
          if (groupItems.length === 0) return;
          
          html += `<div style="margin-bottom:24px;">
            <h3 style="font-size:14px;font-weight:600;color:#374151;margin:0 0 12px 0;padding:8px 12px;background:#f3f4f6;border-radius:6px;">${groupLabels[groupKey]} (${groupItems.length})</h3>`;
          
          const rows = groupItems.map(it => {
            const id = it.id || it._id || it.delivery_id || it.uuid || '';
            const status = it.status || '-';
            const statusLower = String(status).toLowerCase().replace(/[\s_-]/g, '');
            const created = fmtDate(it.created_at || it.createdAt || it.created || '');
            const client = (it.client_name || it.client || it.customer_name) || '';
            
            // Build actions depending on status
            let actionBtn = '';
            
            if (statusLower === 'delivered') {
              // Status: DELIVERED -> Show "Delivered" badge
              actionBtn = `<span style="background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.delivered')}</span>`;
            } else if (statusLower === 'confirmed' || statusLower === 'accepted') {
              // Status: CONFIRMED/ACCEPTED -> Show green "Delivery Confirmed" badge (not a button)
              actionBtn = `<span style="background:#d1fae5;color:#065f46;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.delivery_confirmed')}</span>`;
            } else {
              // All other statuses -> Show green "Confirm" button
              actionBtn = `<button data-id="${id}" class="btn success confirm-delivery">${t('button.confirm')}</button>`;
            }

            return `
              <tr>
                <td style="width:200px;"><strong>${id}</strong><div class="muted" style="font-size:12px">${created}</div></td>
                <td>${client}</td>
                <td>${status}</td>
                <td style="width:280px"><div class="actions">
                  <button data-id="${id}" class="btn open-public">${t('button.details')}</button>
                  ${actionBtn}
                </div></td>
              </tr>
            `;
          }).join('');

          html += `<div class="table-scroll"><table><thead><tr><th>${t('table.delivery')}</th><th>${t('table.client')}</th><th>${t('table.status')}</th><th>${t('table.actions')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
        });

        return html;
      }

      async function loadDeliveries() {
        if (!ensureAuth()) return;
        const container = document.getElementById('deliveriesContainer');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        container.innerHTML = t('admin.deliveries.loading');
        try {
          const res = await authFetch(ADMIN_BASE + '/deliveries');
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) { localStorage.removeItem('ihb_admin_token'); window.location.replace('admin.html'); return; }
            const txt = await res.text(); container.innerHTML = '<div class="error">Failed to load: ' + (txt||res.status) + '</div>'; return;
          }
          const data = await res.json();
          // Some APIs return { deliveries: [...] }
          const items = Array.isArray(data) ? data : (data.deliveries || data.data || []);
          cachedDeliveries = items;
          document.getElementById('deliveriesContainer').innerHTML = renderTable(items, showingArchive);
          attachActions();
          if (window.i18next && typeof window.applyAdminTranslations === 'function') {
            window.applyAdminTranslations(window.i18next);
          }
        } catch (err) {
          container.innerHTML = '<div class="error">Network error: ' + (err.message||err) + '</div>';
        }
      }

      async function loadInstantQuotes() {
        if (!ensureAuth()) return;
        const container = document.getElementById('instantQuotesContainer');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        container.innerHTML = t('admin.deliveries.loading');
        try {
          const res = await authFetch(ADMIN_BASE + '/instant-quotes');
          
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) { 
              localStorage.removeItem('ihb_admin_token'); 
              window.location.replace('admin.html'); 
              return; 
            }
            // Show friendly message if endpoint not implemented yet
            console.error('Failed to load instant quotes:', res.status);
            if (res.status === 404 || res.status === 500) {
              container.innerHTML = '<div class="empty">Instant quotes endpoint is being set up on the server. Please contact the developer.</div>';
            } else {
              const txt = await res.text(); 
              container.innerHTML = '<div class="error">Failed to load quotes: ' + (txt||res.status) + '</div>';
            }
            return;
          }
          
          const data = await res.json();
          console.log('Instant quotes raw response:', data);
          console.log('Response type:', typeof data);
          console.log('Is array:', Array.isArray(data));
          
          // Try multiple ways to extract the items array
          let items = [];
          if (Array.isArray(data)) {
            items = data;
          } else if (data && typeof data === 'object') {
            items = data.quotes || data.data || data.instantQuotes || data.instant_quotes || data.results || [];
            console.log('Extracted items from object property:', items);
          }
          
          console.log('Final items to render:', items, 'Count:', items.length);
          cachedInstantQuotes = items;
          document.getElementById('instantQuotesContainer').innerHTML = renderInstantQuotesTable(items, showingArchive);
          attachActions();
          if (window.i18next && typeof window.applyAdminTranslations === 'function') {
            window.applyAdminTranslations(window.i18next);
          }
        } catch (err) {
          console.error('Network error loading instant quotes:', err);
          container.innerHTML = '<div class="empty">Unable to load instant quotes. The backend endpoint may not be ready yet.</div>';
        }
      }

      // ==================== REVIEWS MANAGEMENT ====================
      function renderReviewsTable(items) {
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        if (!items || items.length === 0) return `<div class="empty">${t('admin.reviews.none')}</div>`;

      function renderInstantQuotesTable(items, showArchived = false) {

          return `<div class="empty">${t('admin.instant_quotes.none')}</div>`;

        const groups = groupItemsByTime(items);
        const groupLabels = {
          today: t('time.today'),
          yesterday: t('time.yesterday'),
          lastWeek: t('time.last_week'),
          older: t('time.older'),
          archived: t('time.archived')

        let html = '';
        
        // Show only archived items if in archive view, otherwise show all except archived
        const groupsToShow = showArchived ? ['archived'] : ['today', 'yesterday', 'lastWeek', 'older'];
        
        groupsToShow.forEach(groupKey => {
          const groupItems = groups[groupKey];
          if (groupItems.length === 0) return;

          const rows = groupItems.map(it => {
            const id = it.id || it._id || it.quote_id || it.uuid || '';
            const status = it.status || 'REQUESTED';

            const created = fmtDate(it.created_at || it.createdAt || it.created || '');
            const email = it.client_email || it.email || '';

            switch(statusLower) {
              case 'requested':

                break;
                
              case 'priced':
                actionBtn = `<span style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.awaiting_response')}</span>`;
                break;
                
              case 'accepted':
                actionBtn = `<span style="background:#d1fae5;color:#065f46;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.quote_accepted')}</span>`;
                break;
                
              case 'declined':
                actionBtn = `<button data-id="${id}" data-type="quote" class="btn secondary revise-price">${t('button.revise_price')}</button>`;
                break;
                
              case 'inprogress':
              case 'in_progress':
                actionBtn = `<span style="background:#dbeafe;color:#1e40af;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.in_transit')}</span>`;
                break;
                
              case 'delivered':
                actionBtn = `<span style="background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;">${t('badge.delivered')}</span>`;
                break;
                
              default:
                actionBtn = `<button data-id="${id}" data-type="quote" class="btn set-price">${t('button.set_price')}</button>`;
            }

            return `
              <tr>
                <td style="width:200px;"><strong>${id}</strong><div class="muted" style="font-size:12px">${created}</div></td>
                <td>${email}<div class="muted" style="font-size:12px">${pickup} → ${delivery}</div><div class="muted" style="font-size:12px">Weight: ${weight}</div></td>
                <td>${status}</td>

      /* Modal builder and renderer for delivery details (styled like track.html) */
      function closeDeliveryModal() {
        const modal = document.getElementById('deliveryModal');
        if (modal) modal.classList.remove('open');

      function createDeliveryModal() {
        if (document.getElementById('deliveryModal')) return document.getElementById('deliveryModal');
        const modal = document.createElement('div');
        modal.id = 'deliveryModal';
        modal.className = 'modal-overlay';
        modal.addEventListener('click', (e) => { if (e.target === modal) closeDeliveryModal(); });

        const card = document.createElement('div');
        card.className = 'modal-card';

        const closeBtn = document.createElement('button');
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        closeBtn.innerHTML = '&times;';
        closeBtn.className = 'modal-close';
        closeBtn.setAttribute('aria-label', 'Close');
        closeBtn.addEventListener('click', closeDeliveryModal);

        const title = document.createElement('h2');
        title.className = 'modal-title';
        title.textContent = t('admin.modal.title');

        const content = document.createElement('div');
        content.id = 'deliveryModalContent';

        card.appendChild(closeBtn);
        card.appendChild(title);
        card.appendChild(content);
        modal.appendChild(card);

      function omitKey(key) {
        const lower = String(key).toLowerCase();
        if (lower === 'client_email') return true;
        if (lower.endsWith('_logs') || lower.endsWith('_log')) return true;
        if (/((email|status).*(log|logs|history))/.test(lower)) return true;
        return false;
      }

      function looksLikeDate(s) {
        if (typeof s !== 'string') return false;
        return /^\d{4}-\d{2}-\d{2}(T|\s)?\d{0,2}:?\d{0,2}:?\d{0,2}/.test(s) || /^\d{4}-\d{2}-\d{2}$/.test(s);
      }

      function formatTimestamp(s) {
        try {
          const v = (typeof s === 'string' && /^\d+$/.test(s)) ? Number(s) : s;
          let d = new Date(v);
          if (isNaN(d.getTime())) return s;
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const day = d.getDate();
          const month = months[d.getMonth()];
          const year = d.getFullYear();
          const hours = String(d.getHours()).padStart(2,'0');
          const minutes = String(d.getMinutes()).padStart(2,'0');
          return `${day} ${month} ${year}, ${hours}:${minutes}`;
        } catch (e) { return s; }
      }

      function renderObjectAsRows(obj) {
        const wrap = document.createElement('div');
        Object.entries(obj).forEach(([key, value]) => {
          if (omitKey(key)) return;
          const row = document.createElement('div');
          row.className = 'modal-row';

          const keyEl = document.createElement('div');
          keyEl.className = 'modal-row-key';
          keyEl.textContent = key.replace(/_/g,' ');

          const valueEl = document.createElement('div');
          valueEl.className = 'modal-row-value';

          if (Array.isArray(value)) {
            valueEl.textContent = value.join(', ');
          } else if (typeof value === 'object' && value !== null) {
            const pre = document.createElement('pre');
            pre.style.margin = '6px 0 0';
            pre.textContent = JSON.stringify(value, null, 2);
            valueEl.appendChild(pre);
          } else {
            if (looksLikeDate(value)) valueEl.textContent = formatTimestamp(value);
            else if (typeof value === 'number') {
              if (value > 1e12 || value > 1e9) valueEl.textContent = formatTimestamp(value);
              else valueEl.textContent = String(value ?? '—');
            } else valueEl.textContent = value ?? '—';
          }

          row.appendChild(keyEl);
          row.appendChild(valueEl);
          wrap.appendChild(row);
        });
        return wrap;
      }

      async function showDeliveryModalById(id, type) {
        const modal = createDeliveryModal();
        const content = document.getElementById('deliveryModalContent');
        content.innerHTML = '<div style="padding:18px;">Loading…</div>';
        modal.classList.add('open');
        
        // Determine endpoint based on type
        const endpoint = type === 'quote' ? 'instant-quotes' : 'deliveries';
        const publicEndpoint = type === 'quote' ? 'instant-quotes' : 'deliveries';
        
        try {
          // Try admin API first
          const adminUrl = ADMIN_BASE + '/' + endpoint + '/' + encodeURIComponent(id);
          let res = await authFetch(adminUrl);
          
          if (!res.ok) {
            // fallback to public endpoint - use correct path for instant quotes
            let publicUrl;
            if (type === 'quote') {
              publicUrl = 'https://ihb-transport-1.onrender.com/api/admin/instant-quotes/' + encodeURIComponent(id);
            } else {
              publicUrl = 'https://ihb-transport-1.onrender.com/api/public/deliveries/' + encodeURIComponent(id);
            }
            res = await authFetch(publicUrl);
            if (!res.ok) {
              const errorText = await res.text();
              throw new Error('Not found: ' + errorText);
            }
          }
          
          const data = await res.json();
          
          let obj = data;
          if (obj && typeof obj === 'object' && Object.keys(obj).length === 1) {
            // Extract nested object (delivery or quote)
            obj = obj.delivery || obj.quote || obj.instantQuote || obj.instant_quote || obj;
          }
          
          content.innerHTML = '';
          content.appendChild(renderObjectAsRows(obj));
        } catch (err) {
          console.error('Error loading details:', err);
          content.innerHTML = '<div style="padding:12px; color:#b91c1c">Failed to load details: ' + (err.message || err) + '</div>';
        }
      }

      function attachActions() {
        // Confirm delivery - calls accept endpoint to send confirmation email
        document.querySelectorAll('.confirm-delivery').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const el = e.currentTarget;
            const id = el.dataset.id;
            if (!id) return;
            if (!confirm('Confirm delivery ' + id + '? This will send a confirmation email to the client.')) return;
            el.disabled = true;
            const originalText = el.textContent;
            el.textContent = 'Confirming...';
            try {
              const res = await authFetch(ADMIN_BASE + '/deliveries/' + encodeURIComponent(id) + '/accept', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
              });
              
              if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('ihb_admin_token');
                alert('Authentication required. Please log in again.');
                window.location.replace('admin.html');
                return;
              }
              
              if (!res.ok) {
                const text = await res.text().catch(() => res.status);
                let errorMsg = 'Failed to confirm delivery: ' + text;
                try {
                  const json = JSON.parse(text);
                  if (json.error) errorMsg = 'Failed to confirm delivery: ' + json.error;
                } catch (e) {}
                alert(errorMsg);
                el.disabled = false;
                el.textContent = originalText;
                return;
              }
              
              alert('Delivery confirmed! Confirmation email sent.');
              loadDeliveries();
              loadInstantQuotes();
            } catch (err) {
              alert('Network error: ' + (err.message || err));
              el.disabled = false;
              el.textContent = originalText;
            }
          });
        });

        // Set price (for REQUESTED deliveries/quotes)
        document.querySelectorAll('.set-price').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const type = e.currentTarget.dataset.type; // 'quote' or undefined
            const endpoint = type === 'quote' ? 'instant-quotes' : 'deliveries';
            
            const priceRaw = prompt('Enter price amount (e.g. 250):');
            if (priceRaw === null) return; // cancelled
            const priceClean = String(priceRaw).trim();
            // normalize comma decimals to dot
            const priceNum = Number(priceClean.replace(',', '.'));
            if (!isFinite(priceNum) || priceNum <= 0) {
              alert('Please enter a valid positive number for the price (e.g. 250).');
              return;
            }
            try {
              // Try admin API first
              let res = await authFetch(ADMIN_BASE + '/' + endpoint + '/' + encodeURIComponent(id) + '/price', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: priceNum })
              }).catch(() => null);

              // If unauthorized, force re-auth and redirect
              if (res && (res.status === 401 || res.status === 403)) {
                localStorage.removeItem('ihb_admin_token');
                alert('Authentication required. Please log in again.');
                window.location.replace('admin.html');
                return;
              }

              // If admin endpoint failed, try a public/fallback API POST
              if (!res || !res.ok) {
                const fallback = await authPostApi('/' + endpoint + '/' + encodeURIComponent(id) + '/price', { price: priceNum }).catch(() => null);
                if (fallback && fallback.ok) { 
                  alert('Price set successfully'); 
                  await loadDeliveries(); 
                  await loadInstantQuotes(); 
                  return; 
                }

                // Extract any response text for debugging
                let debugText = 'No response';
                try {
                  if (res) debugText = await res.text().catch(() => String(res.status));
                  else if (fallback) debugText = await fallback.text().catch(() => String(fallback.status));
                } catch (e) { debugText = String(e); }
                alert('Failed to set price: ' + debugText);
                return;
              }

              // Success from admin endpoint
              alert('Price set successfully');
              await loadDeliveries();
              await loadInstantQuotes();
            } catch (err) { alert('Network error: ' + (err && err.message ? err.message : err)); }
          });
        });

        // Revise price (for DECLINED deliveries)
        document.querySelectorAll('.revise-price').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;

            // normalize comma decimals to dot

            if (!isFinite(priceNum) || priceNum <= 0) {
              alert('Please enter a valid positive number for the price (e.g. 250).');
              return;
            }
            try {
              // Try admin API first
              let res = await authFetch(ADMIN_BASE + '/' + endpoint + '/' + encodeURIComponent(id) + '/price', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: priceNum })
              }).catch(() => null);

              // If unauthorized, force re-auth and redirect
              if (res && (res.status === 401 || res.status === 403)) {
                localStorage.removeItem('ihb_admin_token');
                alert('Authentication required. Please log in again.');
                window.location.replace('admin.html');
                return;
              }

              // If admin endpoint failed, try a public/fallback API POST
              if (!res || !res.ok) {
                const fallback = await authPostApi('/' + endpoint + '/' + encodeURIComponent(id) + '/revise-price', { price: priceNum }).catch(() => null);
                if (fallback && fallback.ok) { 
                  alert('Price revised successfully'); 
                  await loadDeliveries(); 
                  await loadInstantQuotes(); 
                  return; 
                }

                // Extract any response text for debugging
                let debugText = 'No response';
                try {
                  if (res) debugText = await res.text().catch(() => String(res.status));
                  else if (fallback) debugText = await fallback.text().catch(() => String(fallback.status));
                } catch (e) { debugText = String(e); }
                alert('Failed to revise price: ' + debugText);
                return;

              // Success from admin endpoint
              alert('Price revised successfully');
              await loadDeliveries();
              await loadInstantQuotes();
            } catch (err) { alert('Network error: ' + (err && err.message ? err.message : err)); }
          });
        });

        // Start delivery for Accepted deliveries -> calls driver pickup endpoint
        document.querySelectorAll('.start-delivery').forEach(btn => {
          btn.addEventListener('click', async (e) => {

            const id = el.dataset.id;

      // Archive button toggle
      document.getElementById('archiveBtn').addEventListener('click', () => {
        const t = window.i18next ? window.i18next.t.bind(window.i18next) : (k) => k;
        showingArchive = !showingArchive;
        
        // Update button text and style
        const archiveBtn = document.getElementById('archiveBtn');
        if (showingArchive) {
          archiveBtn.textContent = t('button.back_to_current');
          archiveBtn.classList.add('is-active');

          // Update section titles
          document.querySelector('[data-i18n="admin.deliveries.title"]').textContent = t('admin.deliveries.archived');
          document.querySelector('[data-i18n="admin.instant_quotes.title"]').textContent = t('admin.instant_quotes.archived');
          document.getElementById('navLabelDeliveries').textContent = t('admin.deliveries.archived');
          document.getElementById('navLabelInstantQuotes').textContent = t('admin.instant_quotes.archived');
        } else {
          archiveBtn.textContent = t('button.archive');
          archiveBtn.classList.remove('is-active');

          // Restore section titles
          document.querySelector('[data-i18n="admin.deliveries.title"]').textContent = t('admin.deliveries.title');
          document.querySelector('[data-i18n="admin.instant_quotes.title"]').textContent = t('admin.instant_quotes.title');
          document.getElementById('navLabelDeliveries').textContent = t('admin.deliveries.title');
          document.getElementById('navLabelInstantQuotes').textContent = t('admin.instant_quotes.title');
        }
        
        // Re-render tables with new filter
        if (cachedDeliveries.length > 0) {
          document.getElementById('deliveriesContainer').innerHTML = renderTable(cachedDeliveries, showingArchive);
        }
        if (cachedInstantQuotes.length > 0) {
          document.getElementById('instantQuotesContainer').innerHTML = renderInstantQuotesTable(cachedInstantQuotes, showingArchive);
        }
        attachActions();
      });

      // initial load - validate session first
      (async function() {
        const isValid = await validateSession();
        if (!isValid) return; // Redirected to login
        
        loadDeliveries();
        loadInstantQuotes();
        loadReviews();
      })();

      // --- Local i18n for this page (loads i18next and applies translations) ---
      (function(){
        function loadI18nLocal() {
          if (window.i18next) return Promise.resolve(window.i18next);
          return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/i18next@21.9.1/dist/umd/i18next.min.js';
            s.onload = () => resolve(window.i18next);
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        const resources = {
          en: { translation: { 'admin.dashboard.title':'Admin Dashboard','admin.dashboard.subtitle':'Manage deliveries','admin.title':'Admin Dashboard','admin.subtitle':'Manage deliveries','admin.deliveries.title':'Deliveries','admin.deliveries.archived':'Archived Deliveries','admin.instant_quotes.title':'Instant Quotes','admin.instant_quotes.archived':'Archived Instant Quotes','admin.reviews.title':'Customer Reviews','admin.reviews.none':'No reviews','admin.reviews.loading':'Loading…','admin.deliveries.loading':'Loading…','admin.delivery.none':'No deliveries','admin.instant_quotes.none':'No instant quotes','admin.modal.title':'Details','button.refresh':'Refresh','button.logout':'Logout','button.confirm':'Confirm','button.archive':'Archive','button.back_to_current':'Back to Current','button.hide':'Hide','button.show':'Show','table.delivery':'Delivery','table.quote':'Quote','table.client':'Client','table.author':'Author','table.review':'Review','table.date':'Date','table.visible':'Visible','table.status':'Status','table.actions':'Actions','button.details':'Details','button.start':'Start Delivery','button.set_price':'Set Price','button.revise_price':'Revise Price','button.mark_done':'Mark as done','badge.awaiting_response':'Awaiting response','badge.quote_accepted':'Quote accepted','badge.in_transit':'In transit','badge.delivered':'Delivered','badge.delivery_confirmed':'Delivery Confirmed','loading':'Loading…','time.today':'Today','time.yesterday':'Yesterday','time.last_week':'Last Week','time.older':'Older','time.archived':'Archived (30+ days)' } },
          da: { translation: { 'admin.dashboard.title':'Administrator Panel','admin.dashboard.subtitle':'Administrer leverancer','admin.title':'Administrator Panel','admin.subtitle':'Administrer leverancer','admin.deliveries.title':'Leverancer','admin.deliveries.archived':'Arkiverede Leverancer','admin.instant_quotes.title':'Hurtige Tilbud','admin.instant_quotes.archived':'Arkiverede Hurtige Tilbud','admin.reviews.title':'Kundeanmeldelser','admin.reviews.none':'Ingen anmeldelser','admin.reviews.loading':'Indlæser…','admin.deliveries.loading':'Indlæser…','admin.delivery.none':'Ingen leverancer','admin.instant_quotes.none':'Ingen hurtige tilbud','admin.modal.title':'Detaljer','button.refresh':'Opdater','button.logout':'Log ud','button.confirm':'Bekræft','button.archive':'Arkiv','button.back_to_current':'Tilbage til aktuelle','button.hide':'Skjul','button.show':'Vis','table.delivery':'Levering','table.quote':'Tilbud','table.client':'Kunde','table.author':'Forfatter','table.review':'Anmeldelse','table.date':'Dato','table.visible':'Synlig','table.status':'Status','table.actions':'Handlinger','button.details':'Detaljer','button.start':'Start levering','button.set_price':'Sæt pris','button.revise_price':'Revider pris','button.mark_done':'Marker som færdig','badge.awaiting_response':'Afventer svar','badge.quote_accepted':'Tilbud accepteret','badge.in_transit':'Under transport','badge.delivered':'Leveret','badge.delivery_confirmed':'Levering Bekræftet','loading':'Indlæser…','time.today':'I dag','time.yesterday':'I går','time.last_week':'Sidste uge','time.older':'Ældre','time.archived':'Arkiveret (30+ dage)' } }
        };

        // Make applyLocal available globally so loadDeliveries/loadInstantQuotes can call it
        window.applyAdminTranslations = function(i18n) {
          try {
            // Translate header elements (appears in both the sidebar and mobile topbar)
            document.querySelectorAll('[data-i18n="admin.dashboard.title"]').forEach(el => {
              el.textContent = i18n.t('admin.dashboard.title');
            });
            const sub = document.querySelector('[data-i18n="admin.dashboard.subtitle"]'); 
            if (sub) sub.textContent = i18n.t('admin.dashboard.subtitle');
            
            // Translate buttons
            const refresh = document.getElementById('refreshBtn'); 
            if (refresh) refresh.textContent = i18n.t('button.refresh');
            const logout = document.getElementById('logoutBtn'); 
            if (logout) logout.textContent = i18n.t('button.logout');
            const archiveBtn = document.getElementById('archiveBtn');
            if (archiveBtn) {
              archiveBtn.textContent = showingArchive ? i18n.t('button.back_to_current') : i18n.t('button.archive');
            }
            
            // Translate section titles
            const deliveriesTitle = document.querySelector('[data-i18n="admin.deliveries.title"]');
            if (deliveriesTitle) deliveriesTitle.textContent = showingArchive ? i18n.t('admin.deliveries.archived') : i18n.t('admin.deliveries.title');
            const quotesTitle = document.querySelector('[data-i18n="admin.instant_quotes.title"]');
            if (quotesTitle) quotesTitle.textContent = showingArchive ? i18n.t('admin.instant_quotes.archived') : i18n.t('admin.instant_quotes.title');

            // Translate sidebar nav labels
            const navDeliveries = document.getElementById('navLabelDeliveries');
            if (navDeliveries) navDeliveries.textContent = showingArchive ? i18n.t('admin.deliveries.archived') : i18n.t('admin.deliveries.title');
            const navQuotes = document.getElementById('navLabelInstantQuotes');
            if (navQuotes) navQuotes.textContent = showingArchive ? i18n.t('admin.instant_quotes.archived') : i18n.t('admin.instant_quotes.title');
            const navReviews = document.getElementById('navLabelReviews');
            if (navReviews) navReviews.textContent = i18n.t('admin.reviews.title');

            // Translate table headers
            document.querySelectorAll('table thead th').forEach((th, idx) => {
              const keys = ['table.delivery','table.client','table.status','table.actions']; 
              if (keys[idx]) th.textContent = i18n.t(keys[idx]);
            });
            
            // Translate dynamically added buttons
            document.querySelectorAll('.open-public').forEach(b => b.textContent = i18n.t('button.details'));
            document.querySelectorAll('.set-price').forEach(b => b.textContent = i18n.t('button.set_price'));
            document.querySelectorAll('.revise-price').forEach(b => b.textContent = i18n.t('button.revise_price'));
            document.querySelectorAll('.start-delivery').forEach(b => b.textContent = i18n.t('button.start'));
            document.querySelectorAll('.mark-done').forEach(b => b.textContent = i18n.t('button.mark_done'));
          } catch (e) { console.warn('i18n apply failed', e); }
        };

        loadI18nLocal().then(() => {
          try {
            // If i18next is already present, merge these local resources rather than re-initializing
            if (window.i18next && window.i18next.addResourceBundle) {
              ['en','da'].forEach(lng => {
                try {
                  const bundle = resources[lng] && resources[lng].translation ? resources[lng].translation : {};
                  window.i18next.addResourceBundle(lng, 'translation', bundle, true, true);
                } catch (e) { /* ignore */ }
              });
              const lng = localStorage.getItem('i18n_lang') || 'da';
              if (window.i18next.changeLanguage) window.i18next.changeLanguage(lng, () => window.applyAdminTranslations(window.i18next));
              else window.applyAdminTranslations(window.i18next);
              return;
            }

            // Otherwise initialize a local i18next instance
            if (window.i18next && window.i18next.init) {
              window.i18next.init({ lng: localStorage.getItem('i18n_lang')||'da', resources }, () => window.applyAdminTranslations(window.i18next));
            }
          } catch (err) { console.warn('i18n load/apply failed', err); }
        }).catch(err => console.warn('i18n load failed', err));

        const sel = document.getElementById('langSelect');
        if (sel) {
          sel.value = localStorage.getItem('i18n_lang') || 'da';
          sel.addEventListener('change', (e) => {
            const lng = e.target.value;
            localStorage.setItem('i18n_lang', lng);
            if (window.i18next && window.i18next.changeLanguage) {
              window.i18next.changeLanguage(lng, () => {
                window.applyAdminTranslations(window.i18next);
                // Re-render tables with new translations by reloading data
                loadDeliveries();
                loadInstantQuotes();
                loadReviews();
              });
            } else {
              // load and apply
              loadI18nLocal().then(() => window.i18next.init({ lng, resources }, () => {
                window.applyAdminTranslations(window.i18next);
                loadDeliveries();
                loadInstantQuotes();
                loadReviews();
              }));
            }
          });
        }
      })();

      // Re-validate session when page becomes visible (tab switch or window focus)
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          validateSession();
        }
      });

      // Close the details modal on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeDeliveryModal();
      });
    })();
  </script>
</body>
</html>
