<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Quicksand font -->
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="booking-main">
        <div class="form-container">
        <form class="booking-form">
            <h1 class="booking-title">Hey there!, fill out this form to create a booking</h1>
            <!-- Client Details -->
            <h2>Client Details</h2>
            <div class="form-group">
                <label for="client_name">Name</label>
                <input class="form-input" type="text" id="client_name" name="client_name" maxlength="120" required>
            </div>
            <div class="form-group">
                <label for="client_email">Email</label>
                <input type="email" id="client_email" name="client_email" maxlength="120" required>
            </div>
            <!-- Pickup Address Details -->
            <h2>Address Details</h2>
            <div class="form-group">
                <label for="pickup_street">Street</label>
                <input type="text" id="pickup_street" name="pickup_street" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="pickup_city">City</label>
                <input type="text" id="pickup_city" name="pickup_city" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="pickup_post_code">Post Code</label>
                <input type="text" id="pickup_post_code" name="pickup_post_code" maxlength="20" required>
            </div>
            <div class="form-group">
                <label for="pickup_country">Country</label>
                <input type="text" id="pickup_country" name="pickup_country" maxlength="100" required>
            </div>
            <!-- Service Address Details -->
            <h2>Service Address Details</h2>
            <div class="form-group">
                <label for="dropoff_street">Street</label>
                <input type="text" id="dropoff_street" name="dropoff_street" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="dropoff_city">City</label>
                <input type="text" id="dropoff_city" name="dropoff_city" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="dropoff_post_code">Post Code</label>
                <input type="text" id="dropoff_post_code" name="dropoff_post_code" maxlength="20" required>
            </div>
            <div class="form-group">
                <label for="dropoff_country">Country</label>
                <input type="text" id="dropoff_country" name="dropoff_country" maxlength="100" required>
            </div>
            <!-- Item Details -->
            <h2>Item Details</h2>
            <div class="form-group">
                <label for="item_description">Item Description</label>
                <input type="text" id="item_description" name="item_description" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="items">Items</label>
                <textarea id="items" name="items" rows="2" required></textarea>
            </div>
            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="text" id="weight" name="weight" maxlength="50" required>
            </div>
            <!-- Service Details -->
            <h2>Service Details</h2>
            <div class="form-group">
                <label for="service">Service Type</label>
                <select id="service" name="service" required>
                    <option value="">Select a service</option>
                    <option value="Moving Services">Moving Services</option>
                    <option value="Storage Solutions">Storage Solutions</option>
                    <option value="Furniture & Junk Services">Furniture & Junk Services</option>
                    <option value="International Shipping">International Shipping</option>
                </select>
            </div>
            <div class="form-group">
                <label for="service_date">Service Date</label>
                <input type="date" id="service_date" name="service_date" required>
            </div>
            <!-- Submit Button -->
            <button type="submit" class="btn-primary">Submit Booking</button>
        </form>
        </div>
    </main>

    <style>
        /* Tailored form styling using your design language */
        .form-container {
            background: #fff;
            width: 420px;
            margin: 2.5rem auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .booking-title {
            text-align: center;
            color: #2e9e7e;
            font-size: 18px;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .booking-form h2 {
            display: block;
            font-weight: 700;
            margin: 14px 0 6px;
            font-size: 14px;
            color: #111827;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            margin: 6px 0 0;
            color: #374151;
        }

        .booking-form input,
        .booking-form textarea,
        .booking-form select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfcfcf;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: 'Quicksand', Arial, sans-serif;
        }

        .phone-group { display: flex; gap: 8px; }
        .phone-group select { width: 45%; }
        .phone-group input { width: 55%; }

        .form-container button.btn-primary {
            margin-top: 18px;
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 12px;
            width: 140px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }
        .form-container button.btn-primary:hover { background: #4338ca; }

        /* Responsive */
        @media (max-width: 600px) {
            .form-container { width: 94%; padding: 18px; margin: 1.2rem auto; }
            .form-container button.btn-primary { width: 100%; }
        }
    </style>
</body>
</html>
