<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,700&display=swap" rel="stylesheet">
    <!-- Prevent indexing of the admin page; route should be shared privately with client -->
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <main class="booking-main admin-page">
        <div class="form-container">
            <form class="booking-form" id="adminLoginForm" autocomplete="on" novalidate>
                <div class="booking-header">
                    <div class="booking-logo">
                        <img src="static/newLogo.png" alt="IHB Transport Logo" class="booking-logo-img" loading="lazy">
                    </div>
                    <h1 class="booking-title">Administrator Login</h1>
                </div>

                <h2>Credentials</h2>

                <div class="form-group">
                    <label for="admin_email">Email</label>
                    <input id="admin_email" name="admin_email" type="email" required placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label for="admin_password">Password</label>
                    <input id="admin_password" name="admin_password" type="password" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>
    </main>

    <script>
        // Minimal handler: prevent default and show brief feedback (replace with real auth later)
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simple validation
            const email = document.getElementById('admin_email').value.trim();
            const pass = document.getElementById('admin_password').value.trim();
            if (!email || !pass) {
                alert('Please provide both email and password.');
                return;
            }
            // Placeholder: replace with real auth flow
            alert('Admin sign-in submitted (form behavior placeholder).');
        });
    </script>
</body>
</html>
