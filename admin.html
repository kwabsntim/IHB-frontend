<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator - Log ind</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,700&display=swap" rel="stylesheet">
    <!-- Prevent indexing of the admin page; route should be shared privately with client -->
    <meta name="robots" content="noindex, nofollow">
        <style>
            /* Admin page specific styles */
            body {
                font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                margin: 0;
                padding: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }
            
            .booking-main {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 24px;
            }
            
            .form-container {
                width: 100%;
                max-width: 480px;
            }
            
            .booking-form {
                background: #fff;
                border-radius: 16px;
                padding: 36px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }
            
            .booking-header {
                text-align: center;
                margin-bottom: 28px;
            }
            
            .booking-logo-img {
                height: 60px;
                margin-bottom: 16px;
            }
            
            .booking-title {
                font-size: 24px;
                font-weight: 700;
                color: #111827;
                margin: 0;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            .form-group label {
                display: block;
                font-weight: 600;
                color: #374151;
                margin-bottom: 8px;
                font-size: 14px;
            }
            
            .form-group input {
                width: 100%;
                padding: 12px 16px;
                border: 2px solid #e5e7eb;
                border-radius: 8px;
                font-size: 15px;
                font-family: inherit;
                transition: border-color 0.2s;
                box-sizing: border-box;
            }
            
            .form-group input:focus {
                outline: none;
                border-color: #667eea;
            }
            
            .form-error {
                background: #fee2e2;
                border: 1px solid #fca5a5;
                color: #991b1b;
                padding: 12px 16px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 16px;
            }
            
            .btn-primary {
                width: 100%;
                padding: 14px 24px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s;
                font-family: inherit;
            }
            
            .btn-primary:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            }
            
            .btn-primary:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }
            
            /* Admin preloader overlay */
            #adminPreloader {
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                background: rgba(0,0,0,0.35);
                z-index: 9999;
            }
            .admin-preloader-inner {
                background: #fff;
                padding: 18px 22px;
                border-radius: 8px;
                display: flex;
                gap: 12px;
                align-items: center;
                box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            }
            .spinner-dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #111827;
                animation: spin-bounce 0.8s infinite ease-in-out;
            }
            @keyframes spin-bounce {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(0.5); opacity: 0.6; }
            }
        </style>
</head>
<body>
    <main class="booking-main admin-page">
        <div class="form-container">
            <form class="booking-form" id="adminLoginForm" autocomplete="on" novalidate>
                <div class="booking-header">
                    <div class="booking-logo">
                        <img src="static/logo2.png" alt="IHB Transport Logo" class="booking-logo-img" loading="lazy">
                    </div>
                    <h1 class="booking-title" data-i18n="admin.login.title">Administrator - Log ind</h1>
                </div>

                

                <div id="adminError" class="form-error" role="alert" aria-live="assertive" style="display:none; color:#b91c1c; margin-bottom:12px;"></div>

                <div class="form-group">
                    <label for="admin_email" data-i18n="admin.login.email_label">E-mail</label>
                    <input id="admin_email" name="admin_email" type="email" required data-i18n-placeholder="admin.login.email_placeholder" placeholder="admin@eksempel.dk">
                </div>

                <div class="form-group">
                    <label for="admin_password" data-i18n="admin.login.password_label">Adgangskode</label>
                    <input id="admin_password" name="admin_password" type="password" required data-i18n-placeholder="admin.login.password_placeholder" placeholder="Indtast din adgangskode">
                </div>

                <button type="submit" class="btn-primary" data-i18n="admin.login.sign_in">Log ind</button>
            </form>
        </div>
    </main>

        <!-- Preloader shown while signing in -->
        <div id="adminPreloader" aria-hidden="true">
            <div class="admin-preloader-inner" role="status" aria-live="polite">
                    <div class="spinner-dot" aria-hidden="true"></div>
                    <div data-i18n="admin.login.signing_in">Logger ind…</div>
                </div>
        </div>

            <script src="js/main.js"></script>

        <script>
            (function(){
                // Resolve translations at call time so i18n can load asynchronously
                const t = (k) => (window.i18next ? window.i18next.t(k) : k);
                // Use explicit backend login URL as requested
                const LOGIN_URL = 'https://ihb-transport-dk.onrender.com/login';

                const form = document.getElementById('adminLoginForm');
                const emailEl = document.getElementById('admin_email');
                const passEl = document.getElementById('admin_password');

                form.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    // Clear previous error
                    const errorEl = document.getElementById('adminError');
                    if (errorEl) { errorEl.style.display = 'none'; errorEl.textContent = ''; }

                    const email = (emailEl.value || '').trim();
                    const password = (passEl.value || '').trim();

                    if (!email || !password) {
                        if (errorEl) { errorEl.textContent = t('admin.login.error_missing'); errorEl.style.display = 'block'; }
                        return;
                    }

                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalBtnText = submitBtn ? submitBtn.textContent : 'Sign In';
                      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('admin.login.signing_in'); }
                      const preloader = document.getElementById('adminPreloader');
                      if (preloader) preloader.style.display = 'flex';

                    try {
                        const resp = await fetch(LOGIN_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });

                        // Friendly errors: avoid showing raw server logs to the user
                        if (!resp.ok) {
                            if (resp.status === 401 || resp.status === 403) {
                                if (errorEl) { errorEl.textContent = t('admin.login.error_invalid'); errorEl.style.display = 'block'; }
                            } else {
                                if (errorEl) { errorEl.textContent = t('admin.login.error_network'); errorEl.style.display = 'block'; }
                            }
                            // Don't return here, let finally block restore button state
                            if (preloader) preloader.style.display = 'none';
                            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
                            return;
                        }

                        // parse response for token but do not show server messages to user
                        const data = await resp.json().catch(() => null);
                        const token = (data && (data.token || data.access_token || data.accessToken || data.auth_token));
                        if (!token) {
                            if (errorEl) { errorEl.textContent = t('admin.login.error_no_token'); errorEl.style.display = 'block'; }
                            // Don't return here, let finally block restore button state
                            if (preloader) preloader.style.display = 'none';
                            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
                            return;
                        }

                        localStorage.setItem('ihb_admin_token', token);
                        // Redirect to dashboard
                        window.location.href = 'admin-dashboard.html';
                    } catch (err) {
                        if (errorEl) { errorEl.textContent = t('admin.login.error_network'); errorEl.style.display = 'block'; }
                    } finally {
                        if (preloader) preloader.style.display = 'none';
                        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
                    }
                });
            })();
        </script>
</body>
</html>
